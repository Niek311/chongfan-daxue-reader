<!DOCTYPE html>
<html lang="zh-CN" data-theme="sepia">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover, user-scalable=yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="重返大学">
  <meta name="theme-color" content="#f6f1e7">
  <title>重返大学：她们都想圈养我 - Web Reader</title>
  <link rel="stylesheet" href="app.css">
  <link rel="manifest" href="manifest.json">
</head>
<body class="font-sans size-md spacing-normal">

  <header id="top-bar" class="app-bar top-bar">
    <button id="btn-toc" class="icon-btn" aria-label="目录" title="目录">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
      <span>目录</span>
    </button>
    <div class="top-title" id="header-book-title">重返大学：她们都想圈养我</div>
    <button id="btn-settings" class="icon-btn" aria-label="设置" title="设置">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      <span>设置</span>
    </button>
  </header>

  <main id="reader-main" class="reader-container">
    <div id="reading-content" class="reading-content">
      <div id="loading-spinner" class="loading-box">
        <div class="spinner"></div>
        <p>正在加载章节内容...</p>
      </div>
      
      <article id="chapter-article" class="chapter-article"></article>
      
      <div id="page-chapter-nav" class="page-chapter-nav">
        <button id="btn-prev-bottom" class="nav-chapter-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
          上一章
        </button>
        <button id="btn-toc-bottom" class="nav-chapter-btn">目录</button>
        <button id="btn-next-bottom" class="nav-chapter-btn">
          下一章
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
      </div>
    </div>
  </main>

  <footer id="bottom-bar" class="app-bar bottom-bar">
    <button id="btn-prev-chapter" class="bar-btn" title="上一章">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
      <span>上一章</span>
    </button>
    <div class="progress-indicator" id="progress-text">1 / 1101</div>
    <button id="btn-next-chapter" class="bar-btn" title="下一章">
      <span>下一章</span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </button>
  </footer>

  <aside id="toc-drawer" class="drawer">
    <div class="drawer-backdrop" id="toc-backdrop"></div>
    <div class="drawer-content">
      <div class="drawer-header">
        <h3>目录 (<span id="toc-count">1101</span> 章)</h3>
        <button id="btn-close-toc" class="icon-btn-close">&times;</button>
      </div>
      <div class="toc-search-box">
        <input type="text" id="toc-search" placeholder="🔍 输入章节序号或标题..." autocomplete="off">
        <button id="btn-jump-input" class="btn-jump">跳转</button>
      </div>
      <div class="toc-jump-shortcuts">
        <button class="chip" data-jump="1">第 1 章</button>
        <button class="chip" data-jump="200">200 章</button>
        <button class="chip" data-jump="500">500 章</button>
        <button class="chip" data-jump="800">800 章</button>
        <button class="chip" data-jump="1101">最新章</button>
      </div>
      <div id="toc-list" class="toc-list"></div>
    </div>
  </aside>

  <aside id="settings-sheet" class="sheet">
    <div class="sheet-backdrop" id="settings-backdrop"></div>
    <div class="sheet-content">
      <div class="sheet-header">
        <h3>阅读设置</h3>
        <button id="btn-close-settings" class="icon-btn-close">&times;</button>
      </div>
      
      <div class="setting-group">
        <label class="setting-label">背景主题</label>
        <div class="theme-options">
          <button class="theme-btn theme-sepia active" data-theme="sepia">羊皮纸</button>
          <button class="theme-btn theme-light" data-theme="light">明亮白</button>
          <button class="theme-btn theme-dark" data-theme="dark">暗夜黑</button>
          <button class="theme-btn theme-green" data-theme="green">护眼绿</button>
        </div>
      </div>

      <div class="setting-group">
        <label class="setting-label">字体大小</label>
        <div class="font-size-control">
          <button id="btn-font-dec" class="size-btn">A -</button>
          <span id="font-size-label" class="size-value">19 px</span>
          <button id="btn-font-inc" class="size-btn">A +</button>
        </div>
      </div>

      <div class="setting-group">
        <label class="setting-label">行距排版</label>
        <div class="toggle-options">
          <button class="toggle-btn active" data-spacing="normal">标准</button>
          <button class="toggle-btn" data-spacing="loose">宽松</button>
          <button class="toggle-btn" data-spacing="compact">紧凑</button>
        </div>
      </div>

      <div class="setting-group">
        <label class="setting-label">字体类型</label>
        <div class="toggle-options">
          <button class="toggle-btn active" data-font="sans">黑体 (清晰)</button>
          <button class="toggle-btn" data-font="serif">宋体 / 楷体</button>
        </div>
      </div>
    </div>
  </aside>

  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>
</html>
