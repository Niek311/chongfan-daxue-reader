<!DOCTYPE html>
<html lang="vi" data-theme="sepia">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover, user-scalable=yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Trọng Phản Đại Học">
  <meta name="theme-color" content="#f6f1e7">
  <title>Trở Lại Thời Đại Học - Web Reader (Trung - Việt)</title>
  <link rel="stylesheet" href="app.css">
  <link rel="manifest" href="manifest.json">
</head>
<body class="font-sans size-md spacing-normal">

  <!-- Top Navigation Bar -->
  <header id="top-bar" class="app-bar top-bar">
    <button id="btn-toc" class="icon-btn" aria-label="Mục lục" title="Mục lục">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
      <span class="btn-text">Mục lục</span>
    </button>
    
    <!-- Quick Language & Pinyin Controls in Header -->
    <div class="header-controls">
      <div class="lang-switch-header">
        <button class="lang-pill active" data-lang="vi" title="Bản Tiếng Việt">🇻🇳 Việt</button>
        <button class="lang-pill" data-lang="zh" title="Bản Tiếng Trung">🇨🇳 中文</button>
        <button class="lang-pill" data-lang="dual" title="Bản Song Ngữ">📖 Song ngữ</button>
      </div>
      <button id="btn-pinyin-toggle" class="pinyin-pill" title="Bật / Tắt phiên âm Pinyin">
        <span class="pinyin-icon">拼</span>
        <span class="pinyin-status">Pinyin</span>
      </button>
    </div>

    <button id="btn-settings" class="icon-btn" aria-label="Cài đặt" title="Cài đặt">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      <span class="btn-text">Cài đặt</span>
    </button>
  </header>

  <!-- Main Reader Container -->
  <main id="reader-main" class="reader-container">
    <div id="reading-content" class="reading-content">
      <div id="loading-spinner" class="loading-box">
        <div class="spinner"></div>
        <p>Đang tải nội dung...</p>
      </div>
      
      <article id="chapter-article" class="chapter-article"></article>
      
      <div id="page-chapter-nav" class="page-chapter-nav">
        <button id="btn-prev-bottom" class="nav-chapter-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
          Chương trước
        </button>
        <button id="btn-swap-bottom" class="nav-chapter-btn lang-swap-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>
          Đổi Trung / Việt
        </button>
        <button id="btn-next-bottom" class="nav-chapter-btn">
          Chương sau
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
      </div>
    </div>
  </main>

  <!-- Bottom Floating Bar -->
  <footer id="bottom-bar" class="app-bar bottom-bar">
    <button id="btn-prev-chapter" class="bar-btn" title="Chương trước">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
      <span>Trước</span>
    </button>
    <div class="progress-indicator" id="progress-text">1 / 1101</div>
    <button id="btn-next-chapter" class="bar-btn" title="Chương sau">
      <span>Sau</span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </button>
  </footer>

  <!-- Table of Contents Drawer -->
  <aside id="toc-drawer" class="drawer">
    <div class="drawer-backdrop" id="toc-backdrop"></div>
    <div class="drawer-content">
      <div class="drawer-header">
        <h3>Mục lục (<span id="toc-count">1101</span> Chương)</h3>
        <button id="btn-close-toc" class="icon-btn-close">&times;</button>
      </div>
      <div class="toc-search-box">
        <input type="text" id="toc-search" placeholder="🔍 Tìm kiếm chương hoặc số chương..." autocomplete="off">
        <button id="btn-jump-input" class="btn-jump">Đến</button>
      </div>
      <div class="toc-jump-shortcuts">
        <button class="chip" data-jump="1">Chương 1</button>
        <button class="chip" data-jump="200">200</button>
        <button class="chip" data-jump="500">500</button>
        <button class="chip" data-jump="800">800</button>
        <button class="chip" data-jump="1101">Mới nhất</button>
      </div>
      <div id="toc-list" class="toc-list"></div>
    </div>
  </aside>

  <!-- Settings Bottom Sheet -->
  <aside id="settings-sheet" class="sheet">
    <div class="sheet-backdrop" id="settings-backdrop"></div>
    <div class="sheet-content">
      <div class="sheet-header">
        <h3>Cài đặt Đọc truyện</h3>
        <button id="btn-close-settings" class="icon-btn-close">&times;</button>
      </div>
      
      <div class="sheet-scroll-body">
        <!-- Language Mode Selection in Settings -->
        <div class="setting-group">
          <label class="setting-label">Ngôn ngữ hiển thị (Đổi tức thì)</label>
          <div class="toggle-options">
            <button class="toggle-btn active" data-lang="vi">🇻🇳 Tiếng Việt</button>
            <button class="toggle-btn" data-lang="zh">🇨🇳 Tiếng Trung</button>
            <button class="toggle-btn" data-lang="dual">📖 Song ngữ</button>
          </div>
        </div>

        <!-- Pinyin Setting Toggle -->
        <div class="setting-group" id="pinyin-setting-group">
          <label class="setting-label">🔤 Phiên âm Pinyin (Bản Tiếng Trung & Song ngữ)</label>
          <div class="toggle-options">
            <button class="toggle-btn" data-pinyin="on">✨ Bật Pinyin</button>
            <button class="toggle-btn active" data-pinyin="off">Tắt Pinyin</button>
          </div>
        </div>

        <!-- Themes -->
        <div class="setting-group">
          <label class="setting-label">Màu nền & Giao diện</label>
          <div class="theme-options">
            <button class="theme-btn theme-sepia active" data-theme="sepia">Giấy cũ</button>
            <button class="theme-btn theme-light" data-theme="light">Sáng</button>
            <button class="theme-btn theme-dark" data-theme="dark">Ban đêm</button>
            <button class="theme-btn theme-green" data-theme="green">Dịu mắt</button>
          </div>
        </div>

        <!-- Font Size -->
        <div class="setting-group">
          <label class="setting-label">Cỡ chữ</label>
          <div class="font-size-control">
            <button id="btn-font-dec" class="size-btn">A -</button>
            <span id="font-size-label" class="size-value">19 px</span>
            <button id="btn-font-inc" class="size-btn">A +</button>
          </div>
        </div>

        <!-- Spacing -->
        <div class="setting-group">
          <label class="setting-label">Khoảng cách dòng</label>
          <div class="toggle-options">
            <button class="toggle-btn active" data-spacing="normal">Chuẩn</button>
            <button class="toggle-btn" data-spacing="loose">Thoáng</button>
            <button class="toggle-btn" data-spacing="compact">Gọn</button>
          </div>
        </div>

        <!-- Font Family -->
        <div class="setting-group">
          <label class="setting-label">Kiểu chữ</label>
          <div class="toggle-options">
            <button class="toggle-btn active" data-font="sans">Không chân (Sans)</button>
            <button class="toggle-btn" data-font="serif">Có chân (Serif)</button>
          </div>
        </div>
      </div>
    </div>
  </aside>

  <div id="toast" class="toast"></div>

  <script src="data/book.js"></script>
  <script src="app.js"></script>
</body>
</html>
